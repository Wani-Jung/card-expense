name: Build APK

# 깃허브판 APK 2개 + 플레이스토어판 AAB 2개 (REQ-43, v2.0.0~)

# 정식 빌드는 v* 태그 push 에서만 돈다. main push(문서 커밋 포함)로는 돌지 않는다.
# dev 프리릴리스는 Actions 탭에서 수동 실행(workflow_dispatch)할 때만 만든다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 의존성·래퍼·빌드 캐시. 태그 실행도 저장하도록 read-only 를 끈다 (기본은 기본 브랜치에서만 저장).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # NDK 는 러너에 없어서 매번 설치되므로 통째로 보관한다. 버전은 flutter.ndkVersion 그대로 (고정·변경하지 않음).
      - name: NDK path
        run: echo "NDK_DIR=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.NDK_DIR }}
          key: android-ndk-28.2.13676358-${{ runner.os }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret 이 없습니다"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter test
      # 채널별로 기대값이 갈리는 테스트를 스토어 채널로 한 번 더 (업데이트 확인 없음·업데이트 UI 없음)
      - run: flutter test --dart-define=CHANNEL=store test/req43_test.dart

      # 깃허브판 APK 2개 + 플레이스토어판 AAB 2개를 같은 태그에서 만든다.
      # - 깃허브(APK): public → app-release.apk, full(문자 권한) → app-full-release.apk. 업데이트 확인 포함
      # - 스토어(AAB, --dart-define=CHANNEL=store): 자체 업데이트 코드 없음
      #   app-store-public-release.aab(비공개 테스트), app-store-full-release.aab(내부 테스트·문자 권한 심사)
      # 휴대폰용 ABI 2개(arm64-v8a, armeabi-v7a)만 (x86_64 제외, split-per-abi 안 함)
      # versionCode = run_number×10 + (깃허브 APK 0, 스토어 일반 1, 스토어 전용 2). 같은 태그 안에서 겹치지 않고 커지기만 한다.
      - name: Build APKs and AABs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BASE=$(( ${{ github.run_number }} * 10 ))
          ARGS="--target-platform android-arm,android-arm64"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS="$ARGS --build-name=${GITHUB_REF_NAME#v}"
          fi
          flutter build apk --release --flavor public --build-number=$BASE $ARGS
          flutter build apk --release --flavor full --build-number=$BASE $ARGS
          flutter build appbundle --release --flavor public --build-number=$((BASE + 1)) --dart-define=CHANNEL=store $ARGS
          flutter build appbundle --release --flavor full --build-number=$((BASE + 2)) --dart-define=CHANNEL=store $ARGS
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-public-release.apk dist/app-release.apk
          cp build/app/outputs/flutter-apk/app-full-release.apk dist/app-full-release.apk
          cp build/app/outputs/bundle/publicRelease/app-public-release.aab dist/app-store-public-release.aab
          cp build/app/outputs/bundle/fullRelease/app-full-release.aab dist/app-store-full-release.aab

      # 권한 검사. 일반판에 문자 권한이 섞이면 Play Protect 가 설치를 막고, 스토어 심사도 통과 못 한다.
      # 설치 관련 권한(REQUEST_INSTALL_PACKAGES 등)은 어느 판에도 없어야 한다.
      - name: Check permissions
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" \
            https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          BT="java -jar $RUNNER_TEMP/bundletool.jar"
          SMS="RECEIVE_SMS|READ_SMS"
          INSTALL="REQUEST_INSTALL_PACKAGES|INSTALL_PACKAGES|REQUEST_DELETE_PACKAGES"
          "$AAPT" dump permissions dist/app-release.apk > p-apk-public.txt
          "$AAPT" dump permissions dist/app-full-release.apk > p-apk-full.txt
          $BT dump manifest --bundle dist/app-store-public-release.aab > p-aab-public.txt
          $BT dump manifest --bundle dist/app-store-full-release.aab > p-aab-full.txt
          fail=0
          for f in p-apk-public.txt p-aab-public.txt; do
            if grep -E "$SMS" "$f"; then echo "::error::$f 일반판에 문자 권한이 들어 있습니다"; fail=1; fi
          done
          for f in p-apk-full.txt p-aab-full.txt; do
            if ! grep -q "READ_SMS" "$f"; then echo "::error::$f 전용판에 문자 권한이 없습니다"; fail=1; fi
          done
          for f in p-*.txt; do
            if grep -E "$INSTALL" "$f"; then echo "::error::$f 에 설치 관련 권한이 들어 있습니다"; fail=1; fi
          done
          # versionCode·versionName·targetSdk 기록
          for f in p-aab-*.txt; do
            echo "$f: $(grep -oE 'android:(versionCode|versionName|targetSdkVersion)="[^"]*"' "$f" | tr '\n' ' ')"
          done
          exit $fail

      # 스토어 AAB 에는 업데이트 확인 코드(GitHub releases API 주소)가 없어야 한다. 깃허브 APK 에는 있어야 정상.
      - name: Check updater code only in GitHub APKs
        run: |
          KEY="api.github.com/repos/Wani-Jung/card-expense/releases"
          has() { unzip -p "$1" "$2" | grep -c -a "$KEY" || true; }
          a=$(has dist/app-release.apk lib/arm64-v8a/libapp.so)
          b=$(has dist/app-store-public-release.aab base/lib/arm64-v8a/libapp.so)
          c=$(has dist/app-store-full-release.aab base/lib/arm64-v8a/libapp.so)
          echo "github apk=$a store public=$b store full=$c"
          if [ "$a" = 0 ]; then echo "::error::깃허브 APK 에서 업데이트 주소를 못 찾음 (검사 방법 확인 필요)"; exit 1; fi
          if [ "$b" != 0 ] || [ "$c" != 0 ]; then echo "::error::스토어 AAB 에 업데이트 코드가 들어 있습니다"; exit 1; fi

      # v* 태그: 정식 릴리스 (releases/latest/download/app-release.apk·app-full-release.apk 가 이걸 가리킴). AAB 도 같이 첨부
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/*.aab --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.aab --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi

      # 수동 실행(브랜치에서): 'dev' 프리릴리스를 그 커밋으로 갈아끼운다. 정식 링크(latest)에는 영향 없음.
      - name: Release (dev, manual)
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create dev dist/*.apk dist/*.aab \
            --prerelease --target "$GITHUB_SHA" \
            --title "개발 빌드 (${GITHUB_REF_NAME} ${GITHUB_SHA::7})" \
            --notes "수동 실행 빌드입니다. 정식 버전은 v* 릴리스를 받으세요."
