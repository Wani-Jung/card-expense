name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret 이 없습니다"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter test

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionCode 는 매 빌드마다 올라가야 덮어쓰기 설치가 된다.
          ARGS="--build-number=${{ github.run_number }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS="$ARGS --build-name=${GITHUB_REF_NAME#v}"
          fi
          flutter build apk --release $ARGS

      # v* 태그: 정식 릴리스 (releases/latest/download/app-release.apk 가 이걸 가리킴)
      - name: Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi

      # main push: 'dev' 프리릴리스를 최신 커밋으로 갈아끼운다.
      - name: Release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create dev build/app/outputs/flutter-apk/app-release.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "개발 빌드 (main ${GITHUB_SHA::7})" \
            --notes "main 최신 커밋 빌드입니다. 정식 버전은 v* 릴리스를 받으세요."
