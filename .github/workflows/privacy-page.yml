# 개인정보처리방침 단독 페이지 (GitHub Pages, REQ-71 후속)
# Play Console 이 GitHub 파일 보기 화면(blob)을 '간접 링크'로 거부해서(2026-11-26),
# PRIVACY.md 를 HTML 한 장(tools/privacy_page.py)으로 만들어 gh-pages 브랜치에 올린다
# → https://wani-jung.github.io/card-expense/ (Pages 소스 = gh-pages 브랜치 /).
# PRIVACY.md 를 고쳐 main 에 push 하면 자동으로 다시 올라간다(수동 실행도 가능).
name: Privacy page

on:
  push:
    branches: [main]
    paths: [PRIVACY.md, tools/privacy_page.py, .github/workflows/privacy-page.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: privacy-page
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          python3 tools/privacy_page.py request req.json
          gh api markdown --input req.json > body.html
          python3 tools/privacy_page.py wrap body.html site/index.html
          touch site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "privacy page from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
